<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact our Sales Team – Notion</title>
    <link rel="stylesheet" href="./style.css">
    <link rel="stylesheet" href="./contact.css">
    <link rel="icon" href="./assets/favicon.ico" />
</head>
<body>
    <header>
        <nav>
        <img src="./assets/favicon.ico" alt="" />
      </nav>
    </header>

    <main class="contact-main-section">
        <div class="form-content">
            <h1 class="form-hero-heading">We need a few more details to connect.</h1>
            <div class="form-grid">
                <div class="email-wrapper">
                    <p>Work email</p>
                    <input type="email" class="email" placeholder="akshay.antony@vonnue.com" disabled>
                </div>
                <div class="first-name-wrapper wrapper">
                    <p>First name</p>
                    <input type="text">
                </div>
                <div class="last-name-wrapper wrapper">
                    <p>Last name</p>
                    <input type="text">
                </div>
                <div class="company-name-wrapper wrapper">
                    <p>Company name</p>
                    <input type="text">
                </div>
                <div class="job-title-wrapper wrapper">
                    <p>Job title</p>
                    <input type="text">
                </div>
                <div class="country-wrapper wrapper">
                    <p>Country or region</p>
                    <select name="" id="">
                        <option value="">India</option>
                    </select>
                </div>
                <div class="phone-wrapper wrapper">
                    <p>Phone number</p>
                    <input type="tel">
                </div>
                <div class="term-and-conditions">
                    <input type="checkbox">
                    <span>I agree to receiving marketing communications about Notion (optional)</span>
                </div>
                <button class="next-button">
                    Next
                </button>
            </div>
        </div>
        <div class="img-decoration">
            <img src="./assets/Newtons_cradle.webp" alt="">
        </div>
    </main>

    <footer class="contact-footer">
        <p>"Using the most AI‑native tools like Notion is an important competitive advantage for us."</p>
        <img src="./assets/Cursor.svg" class="footer-image" alt="">
    </footer>
</body>
</html>
